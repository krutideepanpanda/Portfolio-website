<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <!-- Transparent background for seamless UI integration -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- K (Cyan) -->
    <!-- Stem -->
    <path d="M 15 15 L 15 85" stroke="#00f2fe" />
    <!-- Arms -->
    <path d="M 35 15 L 15 50 L 35 85" stroke="#00f2fe" />
    
    <!-- Circuit Trace connecting K to D -->
    <path d="M 35 85 L 45 85" stroke="#00f2fe" />
    
    <!-- D (White) -->
    <!-- Stem -->
    <path d="M 45 15 L 45 85" stroke="#ffffff" />
    <!-- Curve -->
    <!-- Max X for this curve is 70 at Y=50 -->
    <path d="M 45 15 L 55 15 C 75 15 75 85 55 85 L 45 85" stroke="#ffffff" />
    
    <!-- Circuit Trace connecting D to P -->
    <path d="M 70 50 L 80 50" stroke="#ffffff" />
    
    <!-- P (Cyan) -->
    <!-- Stem -->
    <path d="M 80 15 L 80 85" stroke="#00f2fe" />
    <!-- Loop -->
    <path d="M 80 15 L 90 15 C 105 15 105 50 90 50 L 80 50" stroke="#00f2fe" />
    
  </g>
</svg>
