<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Blog Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Toast UI Editor CSS -->
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />

  <style>
    :root {
      --bg: #0B0F19;
      --surface: #1E293B;
      --text: #E2E8F0;
      --text-muted: #94A3B8;
      --accent: #00E5FF;
      --accent-hover: #00B8D9;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Main Editor Area */
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow: hidden; /* Changed to hidden so TUI editor handles scrolling */
    }
    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      outline: none;
      margin-bottom: 10px;
      font-family: 'Inter', sans-serif;
    }
    .title-input::placeholder { color: #475569; }
    
    .slug-display {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slug-input {
      background: transparent; border: none; color: var(--text-muted);
      outline: none; font-family: monospace; width: 300px;
    }
    
    #editor-wrapper {
      flex: 1;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    /* Customize TUI Editor Dark Theme slightly to match our neon-dark aesthetic */
    .toastui-editor-dark {
      font-family: 'Inter', sans-serif !important;
    }
    
    /* Sidebar */
    .sidebar {
      width: 350px;
      background-color: var(--surface);
      border-left: 1px solid var(--border);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .sidebar h3 {
      margin: 0 0 10px 0;
      color: var(--accent);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .form-control {
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent);
    }
    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }
    
    .series-box {
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.05);
    }
    
    .btn-save {
      background: var(--accent);
      color: #0B0F19;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: var(--accent-hover);
    }
    
    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10B981; color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error { background: #EF4444; }
  </style>
</head>
<body>

  <!-- Main Editor -->
  <div class="editor-container">
    <input type="text" id="title" class="title-input" placeholder="Title of your post..." autocomplete="off">
    <div class="slug-display">
      <i class="fa-solid fa-link"></i>
      krutideepanpanda.com/Blog/ <input type="text" id="slug" class="slug-input" placeholder="post-url-slug">
    </div>
    <div id="editor-wrapper">
      <div id="editor"></div>
    </div>
  </div>

  <!-- Metadata Sidebar -->
  <div class="sidebar">
    <h3>Metadata</h3>
    
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="category" class="form-control" placeholder="e.g. Silicon Design">
    </div>
    
    <div class="form-group">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags" class="form-control" placeholder="ASIC, RISC-V, EDA">
    </div>
    
    <div class="form-group">
      <label>Summary</label>
      <textarea id="summary" class="form-control" placeholder="A brief description for the blog card..."></textarea>
    </div>
    
    <div class="form-group">
      <label>Read Time</label>
      <input type="text" id="readTime" class="form-control" value="5 min read">
    </div>

    <!-- Series Panel -->
    <div class="series-box">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
        <input type="checkbox" id="isSeries" onchange="toggleSeries()">
        <label for="isSeries" style="color: var(--accent); font-weight: 600; cursor: pointer;">Part of a Series?</label>
      </div>
      
      <div id="seriesFields" style="display: none; flex-direction: column; gap: 12px;">
        <div class="form-group">
          <label>Series ID</label>
          <input type="text" id="seriesId" class="form-control" placeholder="e.g. asic-tapeouts">
        </div>
        <div class="form-group">
          <label>Series Title</label>
          <input type="text" id="seriesTitle" class="form-control" placeholder="Silicon Tapeout Chronicles">
        </div>
        <div class="form-group">
          <label>Chapter Number</label>
          <input type="number" id="chapterNum" class="form-control" placeholder="1">
        </div>
      </div>
    </div>
    
    <button class="btn-save" onclick="savePost()" id="saveBtn">
      <i class="fa-solid fa-paper-plane"></i> Publish Post
    </button>
  </div>

  <div id="toast" class="toast">Successfully created post!</div>

  <!-- Toast UI Editor JS -->
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

  <script>
    // Initialize Toast UI Editor in WYSIWYG mode
    const editor = new toastui.Editor({
      el: document.querySelector('#editor'),
      height: '100%',
      initialEditType: 'wysiwyg',
      previewStyle: 'vertical',
      theme: 'dark',
      initialValue: 'Start writing your amazing article...'
    });

    // Auto-generate slug
    const titleInput = document.getElementById('title');
    const slugInput = document.getElementById('slug');
    
    titleInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const slug = val.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
      slugInput.value = slug;
    });

    function toggleSeries() {
      const isChecked = document.getElementById('isSeries').checked;
      document.getElementById('seriesFields').style.display = isChecked ? 'flex' : 'none';
    }
    
    function showToast(msg, isError=false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function savePost() {
      const title = titleInput.value.trim();
      const slug = slugInput.value.trim();
      
      // Get pure markdown from the WYSIWYG editor!
      let content = editor.getMarkdown().trim();
      
      // Automatically prepend the Title as H1 if not present
      if (!content.startsWith('# ')) {
        content = `# ${title}\n\n${content}`;
      }
      
      if (!title || !slug) {
        showToast("Title and Slug are required!", true);
        return;
      }
      
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
      
      const payload = {
        id: slug,
        title: title,
        content: content,
        category: document.getElementById('category').value,
        tags: document.getElementById('tags').value,
        summary: document.getElementById('summary').value,
        readTime: document.getElementById('readTime').value,
        is_series: document.getElementById('isSeries').checked,
        series_id: document.getElementById('seriesId').value,
        series_title: document.getElementById('seriesTitle').value,
        chapter: document.getElementById('chapterNum').value
      };
      
      try {
        const res = await fetch('/api/save_post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (res.ok) {
          showToast("Post Created Successfully!");
          setTimeout(() => { window.close(); }, 1500);
        } else {
          const err = await res.json();
          showToast(err.error || "Failed to save post", true);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Post';
        }
      } catch (err) {
        showToast("Server error. Is the backend running?", true);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Post';
      }
    }
  </script>
</body>
</html>
