<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Technical Article... | Kruti Deepan Panda</title>
  <link rel="stylesheet" href="blog.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" defer></script>
</head>
<body>

  <main class="article-container">
    <a href="index.html#blog" class="nav-return">
      <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
    </a>

    <!-- Header populated dynamically from article.md YAML frontmatter -->
    <header id="article-header">
      <div class="article-meta">
        <span><i class="fa-solid fa-circle-notch fa-spin"></i> Loading article metadata from /Blog repository...</span>
      </div>
    </header>

    <!-- Markdown content rendered dynamically from article.md -->
    <article class="article-content" id="markdown-content">
      <div style="text-align: center; padding: 4rem 0; color: var(--text-muted);">
        <i class="fa-solid fa-microchip fa-spin" style="font-size: 2rem; color: var(--accent-cyan); margin-bottom: 1rem;"></i>
        <p>Fetching and parsing Markdown document...</p>
      </div>
    </article>

    <footer class="article-footer">
      <div class="article-tags" id="article-footer-tags"></div>
      <a href="index.html#blog" class="nav-return" style="margin: 0;">
        <i class="fa-solid fa-layer-group"></i> Return to Blog Hub
      </a>
    </footer>
  </main>

  <!-- Universal Markdown Loader Engine -->
  <script src="md-loader.js"></script>
</body>
</html>
